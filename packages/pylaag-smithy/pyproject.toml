[project]
name = "pylaag-smithy"
version = "0.1.0"
description = "Smithy document manipulation for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Laag Contributors" }
]
dependencies = [
    "pylaag-core>=0.1.0",
]
keywords = [
    "smithy",
    "api",
    "specification",
    "rest",
    "api-design",
    "api-documentation",
    "aws",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/laag/laag-python"
Repository = "https://github.com/laag/laag-python"
Documentation = "https://github.com/laag/laag-python#readme"
"Bug Tracker" = "https://github.com/laag/laag-python/issues"

[tool.uv.sources]
pylaag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylaag_smithy"]

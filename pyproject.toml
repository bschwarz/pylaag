[project]
name = "laag-python"
version = "0.1.0"
description = "Python port of the laag library for working with API specification formats"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Laag Contributors" }
]
keywords = [
    "api",
    "specification",
    "openapi",
    "swagger",
    "raml",
    "smithy",
    "api-design",
    "api-documentation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

[project.optional-dependencies]
all = [
    "pylaag-core",
    "pylaag-openapi",
    "pylaag-raml",
    "pylaag-smithy",
]

[project.urls]
Homepage = "https://github.com/laag/laag-python"
Repository = "https://github.com/laag/laag-python"
Documentation = "https://github.com/laag/laag-python#readme"
"Bug Tracker" = "https://github.com/laag/laag-python/issues"

[tool.uv.workspace]
members = [
    "packages/pylaag-core",
    "packages/pylaag-openapi",
    "packages/pylaag-raml",
    "packages/pylaag-smithy"
]

[tool.uv.sources]
pylaag-core = { workspace = true }
pylaag-openapi = { workspace = true }
pylaag-raml = { workspace = true }
pylaag-smithy = { workspace = true }

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pyyaml>=6.0.1",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=packages",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--import-mode=importlib",
]

[tool.hypothesis]
# Default profile for local development
max_examples = 100
deadline = 400

[tool.hypothesis.profiles.ci]
# Extended testing for CI
max_examples = 1000
deadline = 1000

[tool.hypothesis.profiles.dev]
# Quick testing during development
max_examples = 20
deadline = 200

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
explicit_package_bases = true
namespace_packages = true
mypy_path = [
    "packages/pylaag-core/src",
    "packages/pylaag-openapi/src",
    "packages/pylaag-raml/src",
    "packages/pylaag-smithy/src",
]
exclude = [
    "^packages/.*/tests/",
]

[[tool.mypy.overrides]]
module = "pylaag.core.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["B008"]  # Allow function calls in argument defaults for pytest fixtures

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
